services:
  app_ollama:
    build:
      context: .
      dockerfile: .hasura-connector/Dockerfile
    develop:
      watch:
        - path: package.json
          action: rebuild
          target: /functions/package.json
        - path: package-lock.json
          action: rebuild
          target: /functions/package-lock.json
        - path: ./
          action: sync+restart
          target: /functions
    environment:
      HASURA_SERVICE_TOKEN_SECRET: $APP_OLLAMA_HASURA_SERVICE_TOKEN_SECRET
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: $APP_OLLAMA_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      OTEL_SERVICE_NAME: $APP_OLLAMA_OTEL_SERVICE_NAME
      OLLAMA_CONNECTION_URI: $APP_OLLAMA_CONNECTION_URI
      GRAPHQL_ENDPOINT: $GRAPHQL_ENDPOINT
    extra_hosts:
      - local.hasura.dev=host-gateway
    ports:
      - mode: ingress
        target: 8080
        published: "9751"
        protocol: tcp
